[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "gitgrab"
version = "1.1.1"
description = "GitHub all-branches repository mirror"
requires-python = ">=3.10"
dependencies = [
    "requests",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pylint.main]
max-line-length = 100
good-names = ["i", "j", "k", "ex", "Run", "lb", "_", "e"]
disable = [
    "W0718",
    "R0801",
    "R0902",
    "R0903",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
